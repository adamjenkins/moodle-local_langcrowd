name: local_langcrowd
summary: A Moodle 5.2+ local plugin that lets your users collaboratively build and vote on language pack translations directly inside the Moodle interface — no external tools required.
description: |
  When crowdsourcing is enabled, users opt into a "translate mode" that
  annotates on-screen language strings with two small badge buttons: approve
  the current translation, or disagree and suggest an alternative. Approvals
  count toward a configurable lock threshold, after which the translation is
  served immediately as the active one; suggestions queue for admin review.
  The target language follows the user's interface language.
